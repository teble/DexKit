import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id("java-library")
    id("org.jetbrains.kotlin.jvm")
    id("io.github.tomtzook.gradle-cmake") version "1.2.2"
}

def enableInternalMetricsApi = providers.gradleProperty("enableInternalMetricsApi")
        .map { it.toBoolean() }
        .orElse(false)
        .get()

cmake {
    targets {
        main {
            cmakeLists.set(file("src/main/cpp/CMakeLists.txt"))
            targetMachines.add(machines.host)
            // use 'ninja' or 'unixMakefiles'
            generator.set(generators.ninja)
            // if you want disable jni log enable it
            // cmakeArgs.add("-DDISABLE_DEXKIT_LOG=ON")
            def configFlags = [
                    "-O3",
                    "-DNDEBUG",
            ].join(" ")
            cmakeArgs.add("-DCMAKE_BUILD_TYPE=Release")
            cmakeArgs.add("-DCMAKE_CXX_FLAGS_RELEASE=$configFlags")
            cmakeArgs.add("-DCMAKE_C_FLAGS_RELEASE=$configFlags")
            cmakeArgs.add("-DDEXKIT_ENABLE_INTERNAL_METRICS=${enableInternalMetricsApi ? 'ON' : 'OFF'}")
            cmakeArgs.add("-DDEXKIT_ENABLE_INTERNAL_METRICS_API=${enableInternalMetricsApi ? 'ON' : 'OFF'}")
            cmakeArgs.add("-DDEXKIT_EXPERIMENT_LAZY_DIRECTORIES=${providers.gradleProperty('experimentLazyDirectories').getOrElse('OFF')}")
            cmakeArgs.add("-DDEXKIT_EXPERIMENT_COMPACT_STRINGS=${providers.gradleProperty('experimentCompactStrings').getOrElse('OFF')}")
            cmakeArgs.add("-DDEXKIT_EXPERIMENT_NEGATIVE_STRINGS=${providers.gradleProperty('experimentNegativeStrings').getOrElse('OFF')}")
            cmakeArgs.add("-DDEXKIT_EXPERIMENT_STRUCTURAL_DESCRIPTORS=${providers.gradleProperty('experimentStructuralDescriptors').getOrElse('OFF')}")
            cmakeArgs.add("-DDEXKIT_EXPERIMENT_POINTER_DESCRIPTORS=${providers.gradleProperty('experimentPointerDescriptors').getOrElse('OFF')}")
            cmakeArgs.add("-DDEXKIT_EXPERIMENT_PAGED_DESCRIPTORS=${providers.gradleProperty('experimentPagedDescriptors').getOrElse('OFF')}")
            cmakeArgs.add("-DDEXKIT_EXPERIMENT_ALIGNED_DESCRIPTORS=${providers.gradleProperty('experimentAlignedDescriptors').getOrElse('OFF')}")
            cmakeArgs.add("-DDEXKIT_EXPERIMENT_DESCRIPTOR_FAST_HITS=${providers.gradleProperty('experimentDescriptorFastHits').getOrElse('OFF')}")
            cmakeArgs.add("-DDEXKIT_EXPERIMENT_RAW_INTERFACES=${providers.gradleProperty('experimentRawInterfaces').getOrElse('OFF')}")
            cmakeArgs.add("-DDEXKIT_EXPERIMENT_COMPACT_INVOKES=${providers.gradleProperty('experimentCompactInvokes').getOrElse('OFF')}")
            cmakeArgs.add("-DDEXKIT_EXPERIMENT_RAW_SOURCE_FILES=${providers.gradleProperty('experimentRawSourceFiles').getOrElse('OFF')}")
            cmakeArgs.add("-DDEXKIT_EXPERIMENT_SINGLE_RELATION=${providers.gradleProperty('experimentSingleRelation').getOrElse('OFF')}")
            cmakeArgs.add("-DDEXKIT_EXPERIMENT_FIELD_IDENTITY_SPLIT=${providers.gradleProperty('experimentFieldIdentitySplit').getOrElse('OFF')}")
            cmakeArgs.add("-DDEXKIT_EXPERIMENT_SINGLE_STRING_DIRECT=${providers.gradleProperty('experimentSingleStringDirect').getOrElse('OFF')}")
            cmakeArgs.add("-DDEXKIT_EXPERIMENT_SINGLE_STRING_ID=${providers.gradleProperty('experimentSingleStringId').getOrElse('OFF')}")
            cmakeArgs.add("-DDEXKIT_EXPERIMENT_SINGLE_STRING_PREFIX=${providers.gradleProperty('experimentSingleStringPrefix').getOrElse('OFF')}")
            cmakeArgs.add("-DDEXKIT_EXPERIMENT_BATCH_STRING_INCLUDES=${providers.gradleProperty('experimentBatchStringIncludes').getOrElse('OFF')}")
            cmakeArgs.add("-DDEXKIT_EXPERIMENT_SINGLE_USING_FIELD=${providers.gradleProperty('experimentSingleUsingField').getOrElse('OFF')}")
            cmakeArgs.add("-DDEXKIT_EXPERIMENT_COMPACT_FIELDS=${providers.gradleProperty('experimentCompactFields').getOrElse('OFF')}")
            cmakeArgs.add("-DDEXKIT_EXPERIMENT_RAW_DESCRIPTOR_LOOKUP=${providers.gradleProperty('experimentRawDescriptorLookup').getOrElse('OFF')}")
        }
    }
}

java {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

sourceSets {
    main {
        java {
            if (enableInternalMetricsApi) {
                srcDir("src/internalMetrics/java")
            }
        }
    }
}

tasks.register("sourcesJar", Jar) {
    archiveClassifier.set("sources")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.main.java.srcDirs)
    include("**/*.java", "**/*.kt")
}

tasks.withType(KotlinCompile).configureEach {
    kotlinOptions.jvmTarget = JavaVersion.VERSION_11
    kotlinOptions.languageVersion = "1.5"
    kotlinOptions.freeCompilerArgs += [
            "-opt-in=kotlin.RequiresOptIn",
    ]
}

test {
    systemProperty("java.library.path", "${layout.buildDirectory.file("library").get().asFile.absolutePath}")
    systemProperty("apk.path", "${layout.projectDirectory.file("apk").asFile.absolutePath}")
}

dependencies {
    implementation("com.google.flatbuffers:flatbuffers-java:23.5.26")
    testImplementation("junit:junit:4.13.2")
}

afterEvaluate {
    tasks.register("copyLibrary") {
        def build = tasks.cmakeBuild
        dependsOn(build)
        doLast {
            copy {
                from layout.buildDirectory.file("cmake").get()
                into layout.buildDirectory.file("library").get()
                include("**/*.so", "**/*.dll", "**/*.dylib")
                eachFile {
                    path = name
                }
                includeEmptyDirs = false
            }
        }
    }
    tasks.jar.dependsOn(tasks.copyLibrary)

    tasks.register("copyReleaseDemo") {
        def assemble = project(":demo").tasks.assembleRelease
        dependsOn(assemble)
        doLast {
            copy {
                from project(":demo").layout.buildDirectory.file("outputs/apk/release").get()
                into "$projectDir/apk"
                include("**/*.apk")
                eachFile {
                    path = name
                }
                rename { String fileName ->
                    fileName.replaceAll(".*\\.apk", "demo.apk")
                }
                includeEmptyDirs = false
            }
        }
    }
    tasks.testClasses.dependsOn(tasks.copyReleaseDemo)
    tasks.testClasses.dependsOn(tasks.copyLibrary)
}

evaluationDependsOn(":demo")
