import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id("java-library")
    id("org.jetbrains.kotlin.jvm")
    id("io.github.tomtzook.gradle-cmake") version "1.2.2"
}

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def isLinux = System.getProperty('os.name').toLowerCase().contains('linux')
def requestedTasks = gradle.startParameter.taskNames.collect { it.toLowerCase() }
def isDexkitReleaseArtifactTask = { String taskName ->
    taskName == 'publish' ||
            taskName == ':publish' ||
            taskName == 'publishtomavenlocal' ||
            taskName == ':publishtomavenlocal' ||
            taskName == 'sign' ||
            taskName == ':sign' ||
            taskName == 'dokka' ||
            taskName == ':dokka' ||
            taskName == 'dokkahtml' ||
            taskName == ':dokkahtml' ||
            taskName == ':dexkit:jar' ||
            taskName == 'dexkit:jar' ||
            taskName == ':dexkit:sourcesjar' ||
            taskName == 'dexkit:sourcesjar' ||
            taskName == ':dexkit:javadocjar' ||
            taskName == 'dexkit:javadocjar' ||
            taskName.startsWith(':dexkit:publish') ||
            taskName.startsWith('dexkit:publish') ||
            taskName.startsWith(':dexkit:sign') ||
            taskName.startsWith('dexkit:sign') ||
            taskName.startsWith(':dexkit:dokka') ||
            taskName.startsWith('dexkit:dokka')
}
def isReleaseArtifactBuild = requestedTasks.any(isDexkitReleaseArtifactTask)
def defaultEnableInternalMetricsApi = !isReleaseArtifactBuild
def localEnableInternalMetricsApi = localProps.getProperty("dexkit.enableInternalMetricsApi")
def gradleEnableInternalMetricsApi = providers.gradleProperty("enableInternalMetricsApi").orNull
def enableInternalMetricsApi = gradleEnableInternalMetricsApi != null
        ? gradleEnableInternalMetricsApi.toBoolean()
        : (isReleaseArtifactBuild
            ? false
            : (localEnableInternalMetricsApi != null
                ? localEnableInternalMetricsApi.toBoolean()
                : defaultEnableInternalMetricsApi))

cmake {
    targets {
        main {
            cmakeLists.set(file("src/main/cpp/CMakeLists.txt"))
            targetMachines.add(machines.host)
            // use 'ninja' or 'unixMakefiles'
            generator.set(generators.ninja)
            // if you want disable jni log enable it
            // cmakeArgs.add("-DDISABLE_DEXKIT_LOG=ON")
            def configFlags = [
                    "-O3",
                    "-DNDEBUG",
            ].join(" ")
            cmakeArgs.add("-DCMAKE_BUILD_TYPE=Release")
            cmakeArgs.add("-DCMAKE_CXX_FLAGS_RELEASE=$configFlags")
            cmakeArgs.add("-DCMAKE_C_FLAGS_RELEASE=$configFlags")
            cmakeArgs.add("-DDEXKIT_ENABLE_INTERNAL_METRICS_API=${enableInternalMetricsApi ? 'ON' : 'OFF'}")
            if (project.hasProperty("linuxMuslBuild") && isLinux) {
                cmakeArgs.add("-DUSE_MUSL_LIBC=ON")
            }
        }
    }
}

java {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

sourceSets {
    main {
        java {
            if (enableInternalMetricsApi) {
                srcDir("src/internalMetrics/java")
            }
        }
    }
}

tasks.withType(KotlinCompile).configureEach {
    kotlinOptions.jvmTarget = JavaVersion.VERSION_11
    kotlinOptions.languageVersion = "1.5"
    kotlinOptions.freeCompilerArgs += [
            "-opt-in=kotlin.RequiresOptIn",
    ]
}

test {
    systemProperty("java.library.path", "${layout.buildDirectory.file("library").get().asFile.absolutePath}")
    systemProperty("apk.path", "${layout.projectDirectory.file("apk").asFile.absolutePath}")
}

dependencies {
    implementation("com.google.flatbuffers:flatbuffers-java:23.5.26")
    testImplementation("junit:junit:4.13.2")
}

afterEvaluate {
    tasks.register("copyLibrary") {
        def build = tasks.cmakeBuild
        dependsOn(build)
        doLast {
            copy {
                from layout.buildDirectory.file("cmake").get()
                into layout.buildDirectory.file("library").get()
                include("**/*.so", "**/*.dll", "**/*.dylib")
                eachFile {
                    path = name
                }
                includeEmptyDirs = false
            }
        }
    }
    tasks.jar.dependsOn(tasks.copyLibrary)

    tasks.register("copyReleaseDemo") {
        def assemble = project(":demo").tasks.assembleRelease
        dependsOn(assemble)
        doLast {
            copy {
                from project(":demo").layout.buildDirectory.file("outputs/apk/release").get()
                into "$projectDir/apk"
                include("**/*.apk")
                eachFile {
                    path = name
                }
                rename { String fileName ->
                    fileName.replaceAll(".*\\.apk", "demo.apk")
                }
                includeEmptyDirs = false
            }
        }
    }
    tasks.testClasses.dependsOn(tasks.copyReleaseDemo)
    tasks.testClasses.dependsOn(tasks.copyLibrary)
}

evaluationDependsOn(":demo")
