import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id("java-library")
    id("org.jetbrains.kotlin.jvm")
    id("io.github.tomtzook.gradle-cmake") version "1.2.2"
}

def enableInternalMetricsApi = providers.gradleProperty("enableInternalMetricsApi")
        .map { it.toBoolean() }
        .orElse(false)
        .get()
def enableSmali = providers.gradleProperty("enableSmali").map { it.toBoolean() }.orElse(true).get()

cmake {
    targets {
        main {
            cmakeLists.set(file("src/main/cpp/CMakeLists.txt"))
            targetMachines.add(machines.host)
            // use 'ninja' or 'unixMakefiles'
            generator.set(generators.ninja)
            // if you want disable jni log enable it
            // cmakeArgs.add("-DDISABLE_DEXKIT_LOG=ON")
            def configFlags = [
                    "-O3",
                    "-DNDEBUG",
            ].join(" ")
            cmakeArgs.add("-DCMAKE_BUILD_TYPE=Release")
            cmakeArgs.add("-DCMAKE_CXX_FLAGS_RELEASE=$configFlags")
            cmakeArgs.add("-DCMAKE_C_FLAGS_RELEASE=$configFlags")
            cmakeArgs.add("-DDEXKIT_ENABLE_INTERNAL_METRICS=${enableInternalMetricsApi ? 'ON' : 'OFF'}")
            cmakeArgs.add("-DDEXKIT_ENABLE_INTERNAL_METRICS_API=${enableInternalMetricsApi ? 'ON' : 'OFF'}")
            cmakeArgs.add("-DDEXKIT_ENABLE_SMALI=${enableSmali ? 'ON' : 'OFF'}")
            cmakeArgs.add("-DDEXKIT_SMALI_SIZE_PROBE=none")
        }
    }
}

// The CMake plugin only tracks the JNI project's sources by default. Core lives
// outside that directory, so changes there must also invalidate the build task.
tasks.matching { it.name.endsWith("_runGeneratorNinja") }.configureEach {
    inputs.files(rootProject.fileTree("Core") {
        include("**/*.cpp", "**/*.cc", "**/*.h", "**/*.hpp", "**/CMakeLists.txt", "**/*.cmake")
        exclude("**/build/**", "**/cmake-build-*/**", "**/.cxx/**")
    }).withPathSensitivity(PathSensitivity.RELATIVE)
}

java {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

sourceSets {
    main {
        java {
            if (enableInternalMetricsApi) {
                srcDir("src/internalMetrics/java")
            }
        }
    }
}

tasks.register("sourcesJar", Jar) {
    archiveClassifier.set("sources")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.main.java.srcDirs)
    include("**/*.java", "**/*.kt")
}

tasks.withType(KotlinCompile).configureEach {
    kotlinOptions.jvmTarget = JavaVersion.VERSION_11
    kotlinOptions.languageVersion = "1.5"
    kotlinOptions.freeCompilerArgs += [
            "-opt-in=kotlin.RequiresOptIn",
    ]
}

test {
    systemProperty("java.library.path", "${layout.buildDirectory.file("library").get().asFile.absolutePath}")
    systemProperty("apk.path", "${layout.projectDirectory.file("apk").asFile.absolutePath}")
    inputs.dir(layout.buildDirectory.dir("library")).withPathSensitivity(PathSensitivity.RELATIVE)
}

dependencies {
    implementation("com.google.flatbuffers:flatbuffers-java:23.5.26")
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.smali:smali:2.5.2")
}

afterEvaluate {
    tasks.register("copyLibrary") {
        def build = tasks.cmakeBuild
        dependsOn(build)
        doLast {
            copy {
                from layout.buildDirectory.file("cmake").get()
                into layout.buildDirectory.file("library").get()
                include("**/*.so", "**/*.dll", "**/*.dylib")
                eachFile {
                    path = name
                }
                includeEmptyDirs = false
            }
        }
    }
    tasks.jar.dependsOn(tasks.copyLibrary)

    tasks.register("copyReleaseDemo") {
        def assemble = project(":demo").tasks.assembleRelease
        dependsOn(assemble)
        doLast {
            copy {
                from project(":demo").layout.buildDirectory.file("outputs/apk/release").get()
                into "$projectDir/apk"
                include("**/*.apk")
                eachFile {
                    path = name
                }
                rename { String fileName ->
                    fileName.replaceAll(".*\\.apk", "demo.apk")
                }
                includeEmptyDirs = false
            }
        }
    }
    // Use the same test class files for JVM reflection and D8, without passing through R8.
    def fixtureOutput = layout.buildDirectory.dir("access-flags-fixture")
    def fixtureDex = tasks.register("accessFlagsFixtureDex", JavaExec) {
        def compiledTests = tasks.named("compileTestJava", JavaCompile)
        dependsOn(compiledTests)
        def classes = compiledTests.get().destinationDirectory.get().asFileTree.matching {
            include("org/luckypray/dexkit/testflags/*.class")
        }
        def android = project(":demo").extensions.getByName("android")
        inputs.files(classes)
        outputs.dir(fixtureOutput)
        classpath = files("${android.sdkDirectory}/build-tools/${android.buildToolsVersion}/lib/d8.jar")
        mainClass.set("com.android.tools.r8.D8")
        doFirst {
            fixtureOutput.get().asFile.mkdirs()
            args = ["--min-api", "21", "--lib", "${android.sdkDirectory}/platforms/${android.compileSdkVersion}/android.jar",
                    "--output", fixtureOutput.get().asFile.absolutePath] + classes.files.collect { it.absolutePath }.sort()
        }
    }
    tasks.test.dependsOn(fixtureDex)
    tasks.test.inputs.dir(fixtureOutput)
    tasks.test.systemProperty("access.flags.dex.path", fixtureOutput.get().file("classes.dex").asFile.absolutePath)
    tasks.testClasses.dependsOn(tasks.copyReleaseDemo)
    tasks.testClasses.dependsOn(tasks.copyLibrary)

    // Classfile output lets the host execute the same consumer keep rules and
    // JNI lookup paths without requiring a connected Android device.
    def consumerJar = tasks.register("smaliConsumerJar", Jar) {
        dependsOn(tasks.compileTestJava)
        archiveBaseName.set("smali-consumer")
        from(tasks.compileTestJava.destinationDirectory) {
            include("org/luckypray/dexkit/smaliconsumer/**")
        }
    }
    def shrunkConsumer = layout.buildDirectory.file("smali-r8/consumer.jar")
    def consumerRules = files(project(":dexkit-android").file("proguard-rules.pro"),
            file("src/test/resources/smali-consumer.pro"))
    def shrinkConsumer = tasks.register("smaliR8Shrink", JavaExec) {
        dependsOn(tasks.jar, consumerJar)
        def android = project(":demo").extensions.getByName("android")
        classpath = files("${android.sdkDirectory}/build-tools/${android.buildToolsVersion}/lib/d8.jar")
        mainClass.set("com.android.tools.r8.R8")
        inputs.files(consumerRules, configurations.runtimeClasspath, tasks.jar.archiveFile, consumerJar.flatMap { it.archiveFile })
        outputs.file(shrunkConsumer)
        doFirst {
            shrunkConsumer.get().asFile.parentFile.mkdirs()
            args = ["--release", "--classfile", "--lib", System.getProperty("java.home"),
                    "--output", shrunkConsumer.get().asFile.absolutePath] +
                    consumerRules.files.collectMany { ["--pg-conf", it.absolutePath] } +
                    [tasks.jar.archiveFile.get().asFile.absolutePath, consumerJar.get().archiveFile.get().asFile.absolutePath] +
                    configurations.runtimeClasspath.files.collect { it.absolutePath }
        }
    }
    tasks.register("smaliR8Consumer", JavaExec) {
        dependsOn(shrinkConsumer, tasks.test)
        classpath = files(shrunkConsumer)
        mainClass.set("org.luckypray.dexkit.smaliconsumer.SmaliConsumer")
        systemProperty("java.library.path", layout.buildDirectory.dir("library").get().asFile.absolutePath)
        args(layout.buildDirectory.file("smali-fixtures/SmaliRoundTrip.dex").get().asFile.absolutePath)
    }
}

evaluationDependsOn(":demo")
