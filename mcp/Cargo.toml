[workspace]
members = ["crates/dexkit-sys", "crates/dexkit-rs", "crates/dexkit-mcp"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "LGPL-3.0-or-later"
publish = false

[workspace.dependencies]
planus = "=1.3.0"
planus-codegen = "=1.3.0"
planus-translation = "=1.3.0"
cmake = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
