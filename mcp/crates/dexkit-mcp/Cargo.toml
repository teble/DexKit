[package]
name = "dexkit-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dexkit-rs = { path = "../dexkit-rs" }
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "fs", "io-util"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
libc = "0.2"

[dev-dependencies]
jsonschema = { version = "=0.57.0", default-features = false }
