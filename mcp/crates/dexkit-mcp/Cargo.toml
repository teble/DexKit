[package]
name = "dexkit-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dexkit-rs = { path = "../dexkit-rs" }
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "fs", "io-util", "net", "signal", "time"] }
tokio-util = "0.7"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
http-body = "1"
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
libc = "0.2"

[dev-dependencies]
jsonschema = { version = "=0.57.0", default-features = false }
rmcp = { version = "=3.4.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }
